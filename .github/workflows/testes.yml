# Suíte do backend contra um Postgres 16 limpo. Sem rede para lojas: os
# testes usam fixtures (nenhum teste faz requisição a loja real).
name: testes

on:
  push:
    branches: [main, "fase/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: sossego
          POSTGRES_PASSWORD: sossego
          POSTGRES_DB: sossego
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U sossego -d sossego"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
